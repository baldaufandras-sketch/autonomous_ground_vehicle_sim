name: Pure pursuit with wide turn

vehicle:
  wheelbase: 2.7
  initial_position:
    - 0.0
    - 1.0
  initial_speed: 5.0
  initial_heading: 0

vehicle limits:
  maximum steering angle in radian: 6
  maximum steering angle gradient in radian: 0.5

path_file_location: "data/paths/wide_turn_path.csv"

controller:
  name: Classic Pursuit
  type: PurePursuit
  lookahead distance: 3
  fallback steering angle: 0.6

simulation:
  length: 10
  timestep: 0.01
